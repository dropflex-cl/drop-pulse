interface:
  display_name: "Optimizar producto"
  short_description: "Elige hooks y automatiza la página en Shopify"
  default_prompt: "Usa $optimize-product para elegir los hooks de mi producto. Después de mi elección, aprueba automáticamente la página y sus imágenes y publica en Shopify sin otra confirmación en DropFlex."
dependencies:
  tools:
    - type: "mcp"
      value: "dropflex"
      description: "Contexto, estrategia, contenido y producción visual de DropFlex"
      transport: "streamable_http"
      url: "https://drop-pulse.vercel.app/api/mcp"
