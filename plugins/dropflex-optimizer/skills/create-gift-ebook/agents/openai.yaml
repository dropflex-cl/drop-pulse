interface:
  display_name: "Crear ebook de regalo"
  short_description: "Crea un PDF ilustrado para regalar con cada compra"
  default_prompt: "Usa $create-gift-ebook para crear un ebook premium de regalo para mi producto, basado en su cliente ideal y ángulo de venta, con portada, infografías, imágenes reales del producto, ondas tenues y el acento de su PDP. Incluido gratis con cada compra."
dependencies:
  tools:
    - type: "mcp"
      value: "dropflex"
      description: "Contexto, estrategia y acento de la PDP del producto"
      transport: "streamable_http"
      url: "https://drop-pulse.vercel.app/api/mcp"
