interface:
  display_name: "Crear ebook de regalo"
  short_description: "Crea un PDF ilustrado para regalar con cada compra"
  default_prompt: "Usa $create-gift-ebook para crear un ebook premium de regalo para mi producto y su ángulo. Infiere la paleta desde su referencia real, crea imágenes e infografías minimalistas propias y diseña una portada y composiciones variadas y coherentes. Incluido gratis con cada compra."
dependencies:
  tools:
    - type: "mcp"
      value: "dropflex"
      description: "Contexto, estrategia y referencia visual real del producto"
      transport: "streamable_http"
      url: "https://drop-pulse.vercel.app/api/mcp"
