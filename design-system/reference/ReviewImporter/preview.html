<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>ReviewImporter</title></head>
<body>
<div id="root"></div>
<script>
  var D = window.DropFlex, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', {style:{display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(320px,1fr))', gap:16, padding:16, alignItems:'start'}},
  h(D.ReviewImporter,{url:'https://es.aliexpress.com/item/1005006….html', minStars:'4'}),
  h('div',{style:{display:'flex', flexDirection:'column', gap:16}},
    h(D.ReviewImporter,{state:'fetching', progress:0.55, detail:'Leyendo reseñas… 112 de 204'}),
    h(D.ReviewImporter,{state:'done', summary:'48 importadas · promedio 4,6', actions:[h(D.Button,{key:1,size:'sm',variant:'primary',iconEnd:'chevron-right'},'Revisar 48')]}),
    h(D.ReviewImporter,{state:'error', filters:false, url:'https://www.amazon.com/dp/B0…', error:'Ese enlace no es de AliExpress. Pega el enlace del producto en aliexpress.com.'}))));
</script>
</body>
</html>
